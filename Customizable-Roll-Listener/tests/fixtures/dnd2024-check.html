<rolltemplate class="dnd-2024 dnd-2024--roll">
  <div class="meta">
    <div class="meta__character-name">Skeleton</div>
  </div>
  <div class="dnd-2024__header dnd-2024__header--Normal">
    <div class="header__summary">
      <div class="header__title">Dexterity Check</div>
    </div>
    <div class="dnd-2024__result--wrapper">
      <div class="dnd-2024__result dnd-2024__result--Normal">
        <div class="result__die result__die--preferred">
          <span class="die__total die__total--preferred" data-result="22"> 22 </span>
        </div>
        <div class="result__mode-indicator result__mode-indicator--Normal"></div>
      </div>
    </div>
  </div>

  <details>
    <summary>Details</summary>
    <div class="dnd-2024__bonus-list">
      <div class="bonus-list__header">
        <span class="bonus-list__header-type" data-rollSubcategory="Ability Check"
          >Ability Check
        </span>
        Breakdown
      </div>
      <div class="rt-formula">
        <div class="rt-formula__raw">1d20</div>
        <div class="rt-formula__evaluated">
          <span class="rt-formula__evaluated-string" data-rollname="Base" data-rollid="Base">
            NATURAL
          </span>
        </div>
      </div>

      <div class="bonus">
        <span class="bonus__label">Dexterity</span>
        <span class="bonus__value">+3</span>
      </div>
      <div class="total">
        <span class="total__label">Total</span>
        <span class="total__value">22</span>
      </div>
    </div>
  </details>
</rolltemplate>
